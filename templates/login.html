<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/style.css') }}">
</head>

<body class="auth-body">

<div class="auth-container">

    <h1>🎬 MovieVerse</h1>

    <form method="POST">

        <input
        type="email"
        name="email"
        placeholder="Email"
        required>

        <input
        type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New user?
        <a href="/signup">
            Signup
        </a>
    </p>

</div>

</body>
</html>
